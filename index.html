<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Учёт Уроков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* CSS Переменные для интеграции темы Telegram */
    :root {
      --tg-bg: var(--tg-theme-bg-color, #f4f4f9);
      --tg-sec-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #000000);
      --tg-hint: var(--tg-theme-hint-color, #999999);
      --tg-link: var(--tg-theme-link-color, #2481cc);
      --tg-btn: var(--tg-theme-button-color, #2481cc);
      --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
      --safe-area-top: env(safe-area-inset-top, 0px);
    }

    body {
      background-color: var(--tg-bg);
      color: var(--tg-text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Стилизация скроллбара */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

    .tg-card {
      background-color: var(--tg-sec-bg);
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.03);
    }

    /* Анимации для модального окна */
    @keyframes slideInUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-animate { animation: slideInUp 0.25s ease-out; }

    /* Сетка календаря */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }
    .calendar-day.other-month { color: var(--tg-hint); opacity: 0.5; }
    .calendar-day.selected { background-color: var(--tg-btn); color: var(--tg-btn-text); }
    .day-dot {
      width: 4px;
      height: 4px;
      background-color: var(--tg-link);
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }
    .calendar-day.selected .day-dot { background-color: var(--tg-btn-text); }
  </style>
</head>
<body class="p-4 pb-28" style="margin-top: var(--safe-area-top)">

  <!-- ШАПКА: Календарь -->
  <header class="mb-5 tg-card p-4 shadow-sm relative">
    <div class="flex items-center justify-between mb-3 px-1">
      <button id="prevMonth" class="text-xl font-bold p-1 text-blue-500 active:scale-95">&larr;</button>
      <h1 id="monthYearLabel" class="text-lg font-bold capitalize tracking-tight text-center"></h1>
      <button id="nextMonth" class="text-xl font-bold p-1 text-blue-500 active:scale-95">&rarr;</button>
    </div>

    <div class="grid grid-cols-7 text-center text-xs font-semibold uppercase text-gray-500 tracking-wider mb-2">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="text-rose-500">Сб</div><div class="text-rose-500">Вс</div>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </header>

  <!-- БЛОК: Статистика -->
  <section class="mb-5 grid grid-cols-2 gap-3">
    <div class="tg-card p-4 border border-slate-100 flex flex-col justify-center">
      <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Доход <span id="statsMonthLabel">месяц</span></p>
      <p id="monthEarned" class="text-2xl font-extrabold text-emerald-600 truncate">0 ₽</p>
    </div>
    <div class="tg-card p-4 border border-slate-100 flex flex-col justify-center text-right">
      <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Уроков за <span id="statsDateLabel">сегодня</span></p>
      <p id="dateLessonsCount" class="text-2xl font-extrabold text-slate-800">0 / 0</p>
    </div>
  </section>

  <!-- БЛОК: Список уроков -->
  <section>
    <div class="flex items-center justify-between mb-3 pl-1">
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Уроки на <span id="currentDateLabel">день</span></h2>
      <button onclick="openModal()" class="text-sm font-medium text-blue-600 bg-blue-100 px-4 py-1.5 rounded-full hover:bg-blue-200 active:scale-95 transition">
        + Урок
      </button>
    </div>
    <div id="lessonsList" class="space-y-3"></div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО (Bottom Sheet) -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-end justify-center p-0 z-50 overflow-hidden" onclick="if(event.target === this) closeModal()">
    <div class="tg-card w-full max-w-lg p-5 rounded-t-3xl shadow-xl space-y-3.5 modal-animate relative max-h-[90vh] overflow-y-auto">
      <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-1"></div>
      <div class="flex justify-between items-center mb-1">
        <h3 id="modalTitle" class="font-bold text-xl">Новый Урок</h3>
        <button onclick="closeModal()" class="text-gray-400 p-2 text-2xl active:scale-90">&times;</button>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 pl-1">Ученик и предмет</label>
        <input id="inStudent" type="text" placeholder="Имя (Математика)" class="w-full p-3 rounded-xl border border-gray-100 text-sm focus:border-blue-300 focus:ring-blue-100 focus:ring-2">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1 pl-1">Дата</label>
          <input id="inDate" type="date" class="w-full p-3 rounded-xl border border-gray-100 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1 pl-1">Время</label>
          <input id="inTime" type="time" step="600" class="w-full p-3 rounded-xl border border-gray-100 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 pl-1">Стоимость (₽)</label>
        <input id="inPrice" type="number" placeholder="1500" class="w-full p-3 rounded-xl border border-gray-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 pl-1">Заметка к уроку</label>
        <textarea id="inNote" rows="3" placeholder="Тема, ссылки или ДЗ..." class="w-full p-3 rounded-xl border border-gray-100 text-sm resize-none"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveLesson()" class="flex-1 bg-blue-600 text-white font-semibold py-3.5 rounded-xl active:scale-[0.97] transition">
          Сохранить Урок
        </button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
      if (tg.HeaderColor) tg.setHeaderColor('secondary_bg_color');
    }

    // Инициализация дат
    let calendarDate = new Date(); // Месяц в календаре
    let selectedDate = new Date(); // Выбранный день
    let lessons = [];

    // Загрузка данных
    function loadData() {
      // 1. Локально
      try {
        const local = localStorage.getItem('tutor_lessons');
        if (local) lessons = JSON.parse(local);
      } catch(e) {}

      // 2. Из облака Telegram
      if (tg?.CloudStorage) {
        tg.showProgress();
        tg.CloudStorage.getItem('tutor_lessons_v2', (err, val) => {
          tg.hideProgress();
          if (!err && val) {
            try { lessons = JSON.parse(val); render(); } catch(e) {}
          } else { render(); } // Рендерим локальные если облака нет
        });
      } else {
        render();
      }
    }

    // Сохранение
    function saveData() {
      const dataStr = JSON.stringify(lessons);
      localStorage.setItem('tutor_lessons', dataStr);
      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('tutor_lessons_v2', dataStr, (err) => {
          if (err) console.error("Cloud save error:", err);
        });
      }
      render();
    }

    // Haptic feedback (вибрация)
    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
      }
    }

    // Вспомогательные функции для дат
    const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
    const formatDateISO = (date) => date.toISOString().split('T')[0];
    const formatPrice = (p) => Number(p).toLocaleString('ru-RU') + ' ₽';
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    // ЛОГИКА КАЛЕНДАРЯ
    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      document.getElementById('monthYearLabel').innerText = `${monthNames[month]} ${year}`;
      document.getElementById('statsMonthLabel').innerText = monthNames[month].slice(0, 3);

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay(); // Вс=0, Пн=1...
      const prevMonthDays = new Date(year, month, 0).getDate();
      const currentMonthDays = new Date(year, month + 1, 0).getDate();

      const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1; // Корректировка для Пн=0

      // Дни прошлого месяца
      for (let i = adjustedFirstDay - 1; i >= 0; i--) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day other-month';
        dayEl.innerText = prevMonthDays - i;
        grid.appendChild(dayEl);
      }

      // Дни текущего месяца
      for (let d = 1; d <= currentMonthDays; d++) {
        const dateObj = new Date(year, month, d);
        const dateStr = formatDateISO(dateObj);
        
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';
        if (isSameDay(dateObj, new Date())) dayEl.classList.add('font-bold', 'text-blue-500');
        if (isSameDay(dateObj, selectedDate)) dayEl.classList.add('selected');

        dayEl.innerText = d;

        // Точка если есть уроки
        if (lessons.some(l => l.date === dateStr)) {
          const dot = document.createElement('div');
          dot.className = 'day-dot';
          dayEl.appendChild(dot);
        }

        dayEl.onclick = () => {
          haptic();
          selectedDate = dateObj;
          render();
        };
        grid.appendChild(dayEl);
      }

      // Дни следующего месяца
      const remainingCells = 42 - grid.children.length; // 6 строк по 7 дней
      for (let i = 1; i <= remainingCells; i++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day other-month';
        dayEl.innerText = i;
        grid.appendChild(dayEl);
      }
    }

    // ЛОГИКА СТАТИСТИКИ И СПИСКА УРОКОВ
    function renderLessons() {
      const dateStr = formatDateISO(selectedDate);
      
      // Заголовок даты
      const df = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' });
      const formattedDate = df.format(selectedDate);
      document.getElementById('currentDateLabel').innerText = isSameDay(selectedDate, new Date()) ? 'Сегодня, ' + formattedDate : formattedDate;
      document.getElementById('statsDateLabel').innerText = isSameDay(selectedDate, new Date()) ? 'сегодня' : formattedDate.split(' ')[0];

      // Статистика месяца
      const monthPrefix = dateStr.slice(0, 7); // ГГГГ-ММ
      const monthLessons = lessons.filter(l => l.date.startsWith(monthPrefix));
      const earnedMonth = monthLessons.reduce((sum, l) => sum + (l.status === 'completed' ? Number(l.price) : 0), 0);
      document.getElementById('monthEarned').innerText = formatPrice(earnedMonth);

      // Статистика выбранного дня
      const dayLessons = lessons
        .filter(l => l.date === dateStr)
        .sort((a,b) => a.time.localeCompare(b.time));
      const completedDay = dayLessons.filter(l => l.status === 'completed').length;
      document.getElementById('dateLessonsCount').innerText = `${completedDay} / ${dayLessons.length}`;

      // Список уроков
      const listEl = document.getElementById('lessonsList');
      if (dayLessons.length === 0) {
        listEl.innerHTML = `<div class="tg-card p-8 rounded-2xl text-center text-gray-400 text-xs italic">На этот день уроков нет</div>`;
        return;
      }

      listEl.innerHTML = dayLessons.map(l => {
        const isDone = l.status === 'completed';
        const isCanceled = l.status === 'canceled';
        const badgeClass = isDone ? 'bg-emerald-100 text-emerald-800' :
                           isCanceled ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800';
        const badgeText = isDone ? '✓ Состоялся' : isCanceled ? '✕ Отменён' : '• Ждём';

        return `
          <div class="tg-card p-4 shadow-sm border border-slate-50 space-y-2.5">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-base leading-tight">${l.student}</p>
                <p class="text-xs text-gray-400 mt-0.5">в ${l.time}</p>
              </div>
              <span class="text-[10px] font-bold px-3 py-1.5 rounded-full ${badgeClass} uppercase tracking-wider">${badgeText}</span>
            </div>

            ${l.note ? `<p class="text-[13px] text-gray-600 bg-gray-50 dark:bg-black/10 p-3 rounded-xl border border-gray-100 dark:border-white/5 leading-relaxed">${l.note}</p>` : ''}

            <div class="flex justify-between items-center pt-1.5 border-t border-gray-50 dark:border-white/5">
              <span class="font-extrabold text-slate-800 dark:text-white text-base">${formatPrice(l.price)}</span>
              <div class="flex gap-2.5">
                <button onclick="toggleStatus('${l.id}')" class="text-xs px-4 py-2 bg-gray-100 dark:bg-black/15 active:bg-gray-200 dark:active:bg-black/25 rounded-xl font-semibold text-gray-700 dark:text-gray-300">
                  Статус
                </button>
                <button onclick="deleteLesson('${l.id}')" class="text-sm px-2 text-rose-500 active:scale-90 opacity-60">
                  ✕
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ОБЩИЙ РЕНДЕР
    function render() {
      renderCalendar();
      renderLessons();
    }

    // ЛОГИКА МОДАЛЬНОГО ОКНА И ОПЕРАЦИЙ
    function openModal() {
      haptic();
      document.getElementById('modalTitle').innerText = "Новый Урок";
      document.getElementById('inDate').value = formatDateISO(selectedDate);
      document.getElementById('inTime').value = "15:00"; // Default time
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
      // Очистка полей
      document.getElementById('inStudent').value = '';
      document.getElementById('inPrice').value = '';
      document.getElementById('inNote').value = '';
    }

    function saveLesson() {
      const student = document.getElementById('inStudent').value.trim();
      const date = document.getElementById('inDate').value;
      const time = document.getElementById('inTime').value;
      const price = document.getElementById('inPrice').value;
      const note = document.getElementById('inNote').value.trim();

      if (!student || !date || !price || !time) {
        haptic('warning');
        tg.showAlert('Пожалуйста, заполни поля:\nУченик, Дата, Время и Стоимость');
        return;
      }

      // Сохраняем как запланированный
      lessons.push({
        id: 'lesson_' + Date.now(),
        student, date, time, note,
        price: Number(price),
        status: 'scheduled'
      });

      haptic('success');
      saveData();
      closeModal();
    }

    function toggleStatus(id) {
      const index = lessons.findIndex(l => l.id === id);
      if (index === -1) return;
      const statuses = ['scheduled', 'completed', 'canceled'];
      const currentIdx = statuses.indexOf(lessons[index].status);
      lessons[index].status = statuses[(currentIdx + 1) % 3]; // Перебор по кругу
      
      haptic();
      saveData();
    }

    function deleteLesson(id) {
      tg.showConfirm("Ты точно хочешь удалить этот урок из истории?", (ok) => {
        if (ok) {
          lessons = lessons.filter(l => l.id !== id);
          haptic('warning');
          saveData();
        }
      });
    }

    // Обработчики кнопок месяца
    document.getElementById('prevMonth').onclick = () => {
      haptic();
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('nextMonth').onclick = () => {
      haptic();
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    };

    // Старт
    loadData();
  </script>
</body>
</html>

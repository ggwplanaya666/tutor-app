<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учёт уроков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f8fafc);
      color: var(--tg-theme-text-color, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .tg-card {
      background-color: var(--tg-theme-secondary-bg-color, #ffffff);
    }
  </style>
</head>
<body class="p-4 pb-24">

  <!-- Шапка: Выбор месяца и статистика дохода -->
  <header class="mb-4">
    <div class="flex items-center justify-between mb-3">
      <button id="prevMonth" class="p-2 text-blue-500 font-bold text-lg">&larr;</button>
      <h1 id="currentMonthLabel" class="text-lg font-semibold tracking-wide capitalize"></h1>
      <button id="nextMonth" class="p-2 text-blue-500 font-bold text-lg">&rarr;</button>
    </div>

    <!-- Карточка дохода за выбранный месяц -->
    <div class="tg-card p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wider">Доход за месяц</p>
        <p id="totalEarned" class="text-2xl font-bold text-emerald-600">0 ₽</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-500">Уроков проведено</p>
        <p id="completedCount" class="text-base font-semibold text-slate-700">0</p>
      </div>
    </div>
  </header>

  <!-- Список уроков на выбранную дату -->
  <section>
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Список занятий</h2>
      <button onclick="openModal()" class="text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full hover:bg-blue-100 transition">
        + Добавить
      </button>
    </div>
    <div id="lessonsList" class="space-y-3">
      <!-- Рендерятся уроки -->
    </div>
  </section>

  <!-- Модальное окно создания урока -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="tg-card w-full max-w-md p-5 rounded-t-3xl sm:rounded-2xl shadow-xl space-y-3">
      <div class="flex justify-between items-center mb-1">
        <h3 class="font-bold text-lg">Новый урок</h3>
        <button onclick="closeModal()" class="text-gray-400 text-xl">&times;</button>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Ученик / Предмет</label>
        <input id="inStudent" type="text" placeholder="Иван (Математика)" class="w-full p-2.5 rounded-xl border border-gray-200 text-sm focus:outline-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Дата</label>
          <input id="inDate" type="date" class="w-full p-2.5 rounded-xl border border-gray-200 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Время</label>
          <input id="inTime" type="time" class="w-full p-2.5 rounded-xl border border-gray-200 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Стоимость (₽)</label>
        <input id="inPrice" type="number" placeholder="1500" class="w-full p-2.5 rounded-xl border border-gray-200 text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Заметка к уроку</label>
        <textarea id="inNote" rows="2" placeholder="Тема, дз или ссылки..." class="w-full p-2.5 rounded-xl border border-gray-200 text-sm"></textarea>
      </div>

      <button onclick="saveLesson()" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl mt-2 active:scale-[0.98] transition">
        Сохранить урок
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentDate = new Date();
    let lessons = JSON.parse(localStorage.getItem('tutor_lessons') || '[]');

    function saveToStorage() {
      localStorage.setItem('tutor_lessons', JSON.stringify(lessons));
      // Синхронизация с облаком Telegram
      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('tutor_lessons', JSON.stringify(lessons));
      }
      render();
    }

    function loadCloudData() {
      if (tg?.CloudStorage) {
        tg.CloudStorage.getItem('tutor_lessons', (err, val) => {
          if (!err && val) {
            lessons = JSON.parse(val);
            render();
          }
        });
      }
    }

    function toggleStatus(id) {
      const item = lessons.find(l => l.id === id);
      if (!item) return;

      if (item.status === 'scheduled') item.status = 'completed';
      else if (item.status === 'completed') item.status = 'canceled';
      else item.status = 'scheduled';

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      saveToStorage();
    }

    function deleteLesson(id) {
      lessons = lessons.filter(l => l.id !== id);
      saveToStorage();
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Название месяца
      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      document.getElementById('currentMonthLabel').innerText = `${monthNames[month]} ${year}`;

      // Фильтр уроков по текущему месяцу
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthLessons = lessons
        .filter(l => l.date.startsWith(monthPrefix))
        .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      // Подсчет статистики
      let earned = 0;
      let completed = 0;

      monthLessons.forEach(l => {
        if (l.status === 'completed') {
          earned += Number(l.price) || 0;
          completed++;
        }
      });

      document.getElementById('totalEarned').innerText = `${earned.toLocaleString('ru-RU')} ₽`;
      document.getElementById('completedCount').innerText = `${completed} / ${monthLessons.length}`;

      // Отрисовка списка
      const listEl = document.getElementById('lessonsList');
      if (monthLessons.length === 0) {
        listEl.innerHTML = `<div class="tg-card p-6 rounded-2xl text-center text-gray-400 text-sm">В этом месяце уроков пока нет</div>`;
        return;
      }

      listEl.innerHTML = monthLessons.map(l => {
        const isDone = l.status === 'completed';
        const isCanceled = l.status === 'canceled';

        const badgeClass = isDone ? 'bg-emerald-100 text-emerald-700' :
                           isCanceled ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700';
        const badgeText = isDone ? 'Проведён' : isCanceled ? 'Отменён' : 'Запланирован';

        return `
          <div class="tg-card p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-semibold text-base">${l.student}</p>
                <p class="text-xs text-gray-400">${l.date} в ${l.time}</p>
              </div>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full ${badgeClass}">${badgeText}</span>
            </div>

            ${l.note ? `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded-lg italic">${l.note}</p>` : ''}

            <div class="flex justify-between items-center pt-1">
              <span class="font-bold text-slate-800">${Number(l.price).toLocaleString('ru-RU')} ₽</span>
              <div class="flex gap-2">
                <button onclick="toggleStatus('${l.id}')" class="text-xs px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-700 font-medium">
                  Сменить статус
                </button>
                <button onclick="deleteLesson('${l.id}')" class="text-xs px-2 py-1.5 text-rose-500 hover:bg-rose-50 rounded-lg">
                  ✕
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal() {
      document.getElementById('inDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function saveLesson() {
      const student = document.getElementById('inStudent').value.trim();
      const date = document.getElementById('inDate').value;
      const time = document.getElementById('inTime').value;
      const price = document.getElementById('inPrice').value;
      const note = document.getElementById('inNote').value.trim();

      if (!student || !date || !price) {
        alert('Заполните ученика, дату и стоимость');
        return;
      }

      lessons.push({
        id: 'lesson_' + Date.now(),
        student,
        date,
        time: time || '12:00',
        price: Number(price),
        status: 'scheduled',
        note
      });

      saveToStorage();
      closeModal();
      document.getElementById('inStudent').value = '';
      document.getElementById('inPrice').value = '';
      document.getElementById('inNote').value = '';
    }

    document.getElementById('prevMonth').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      render();
    };

    document.getElementById('nextMonth').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      render();
    };

    loadCloudData();
    render();
  </script>
</body>
</html>

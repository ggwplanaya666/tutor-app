<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Учёт уроков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    body {
      background-color: #0B0D13;
      color: #F1F5F9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass-card {
      background: linear-gradient(180deg, rgba(23, 27, 38, 0.95) 0%, rgba(17, 20, 29, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glow-purple {
      background: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 60%);
    }

    .glow-cyan {
      background: radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.18) 0%, transparent 60%);
    }

    input, textarea, select {
      background-color: #171B26 !important;
      color: #FFFFFF !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, textarea:focus {
      border-color: #6366F1 !important;
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    input::placeholder, textarea::placeholder {
      color: #64748B !important;
    }

    .day-pill {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .day-pill.active {
      background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.7); }
      70% { transform: scale(1.04); box-shadow: 0 0 0 18px rgba(147, 51, 234, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(147, 51, 234, 0); }
    }
    .mic-active {
      animation: pulse-ring 1.3s infinite;
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%) !important;
      border-color: #F43F5E !important;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-enter {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 3D Wheel Carousel для аватарок */
    .wheel-scene {
      perspective: 1000px;
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-carousel {
      width: 130px;
      height: 130px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .wheel-cell {
      position: absolute;
      width: 120px;
      height: 120px;
      left: 5px;
      top: 5px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
      border: 3px solid rgba(255,255,255,0.15);
      cursor: pointer;
      user-select: none;
    }

    /* Нижний стеклянный TabBar */
    .tabbar-blur {
      background: rgba(15, 18, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="p-4 pb-32 select-none">

  <!-- ============================================== -->
  <!-- ВКЛАДКА 1: ОСНОВНОЙ ЖУРНАЛ И ДОХОД             -->
  <!-- ============================================== -->
  <main id="tabJournal" class="space-y-5">
    <!-- ШАПКА -->
    <header class="flex items-center justify-between pt-1">
      <div>
        <p class="text-[11px] font-semibold tracking-widest uppercase text-indigo-400">График & Доход</p>
        <h1 id="monthTitle" class="text-xl font-bold tracking-tight text-white capitalize mt-0.5">Сентябрь 2026</h1>
      </div>
      <div class="flex gap-1.5 bg-[#171B26] p-1 rounded-xl border border-white/5">
        <button id="prevMonthBtn" class="p-2 text-slate-400 hover:text-white active:scale-90 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="nextMonthBtn" class="p-2 text-slate-400 hover:text-white active:scale-90 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </header>

    <!-- КАРТОЧКИ ДОХОДА -->
    <section class="grid grid-cols-2 gap-3">
      <div class="glass-card glow-cyan p-4 rounded-2xl relative overflow-hidden">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Доход в месяц</span>
        <p id="monthTotal" class="text-2xl font-extrabold tracking-tight text-white">0 ₽</p>
        <div class="flex items-center gap-1.5 mt-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="monthCompletedStat" class="text-[11px] text-slate-400 font-medium">0 уроков</span>
        </div>
      </div>

      <div class="glass-card glow-purple p-4 rounded-2xl relative overflow-hidden">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Выбранный день</span>
        <p id="dayTotal" class="text-2xl font-extrabold tracking-tight text-white">0 ₽</p>
        <div class="flex items-center gap-1.5 mt-2">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
          <span id="dayLessonsStat" class="text-[11px] text-slate-400 font-medium">0 занятий</span>
        </div>
      </div>
    </section>

    <!-- ГОРИЗОНТАЛЬНЫЙ КАЛЕНДАРЬ -->
    <section>
      <div id="daysRow" class="flex gap-2.5 overflow-x-auto pb-2 -mx-4 px-4 scrollbar-none"></div>
    </section>

    <!-- СПИСОК УРОКОВ -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Занятия</h2>
          <span id="activeDateBadge" class="text-[11px] font-semibold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-md border border-indigo-500/20">Сегодня</span>
        </div>
        <button onclick="openModalForCreate()" class="text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition flex items-center gap-1.5">
          <!-- Iconimate Plus -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Новый урок
        </button>
      </div>

      <div id="lessonsList" class="space-y-3"></div>
    </section>
  </main>

  <!-- ============================================== -->
  <!-- ВКЛАДКА 2: ВЫБОР АВАТАРОК (КОЛЕСО ORI-GAMI)   -->
  <!-- ============================================== -->
  <main id="tabProfile" class="hidden space-y-6 pt-2">
    <header class="text-center">
      <span class="text-[11px] font-semibold tracking-widest uppercase text-indigo-400">Персонализация</span>
      <h2 class="text-2xl font-bold text-white mt-1">Оригами-Аватар</h2>
      <p class="text-xs text-slate-400 mt-1">Вращайте колесо и выберите ваш талисман</p>
    </header>

    <!-- 3D КОЛЕСО -->
    <div class="glass-card p-6 rounded-3xl border border-white/10 flex flex-col items-center relative overflow-hidden">
      <div class="wheel-scene my-2">
        <div id="avatarWheel" class="wheel-carousel">
          <!-- Карточки аватарок заполняются JS -->
        </div>
      </div>

      <!-- Кнопки управления вращением -->
      <div class="flex items-center gap-4 mt-4">
        <button onclick="rotateWheel(-1)" class="w-11 h-11 rounded-2xl bg-[#171B26] border border-white/10 flex items-center justify-center text-white active:scale-90 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button onclick="confirmSelectedAvatar()" class="px-6 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs tracking-wider uppercase shadow-lg shadow-indigo-600/30 active:scale-95 transition">
          Выбрать этот
        </button>
        <button onclick="rotateWheel(1)" class="w-11 h-11 rounded-2xl bg-[#171B26] border border-white/10 flex items-center justify-center text-white active:scale-90 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <p id="currentAvatarName" class="text-sm font-bold text-indigo-300 mt-4 tracking-wide">Лазурный Дракон</p>
    </div>

    <!-- Инфо-карточка -->
    <div class="glass-card p-4 rounded-2xl flex items-center gap-3.5">
      <div id="previewCurrentAvatar" class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 border border-white/20"></div>
      <div>
        <h4 class="text-sm font-bold text-white">Текущий аватар сохранён</h4>
        <p class="text-xs text-slate-400 mt-0.5">Отображается в панели таб-бара и профиле</p>
      </div>
    </div>
  </main>

  <!-- ============================================== -->
  <!-- ПЛАВАЮЩИЙ МИКРОФОН (Ассистент)                 -->
  <!-- ============================================== -->
  <div id="floatingVoiceWrap" class="fixed bottom-24 right-5 flex flex-col items-end z-40">
    <div id="voiceStatus" class="hidden mb-2 px-3 py-1.5 bg-[#171B26]/95 backdrop-blur-md border border-indigo-500/30 text-indigo-300 text-xs font-medium rounded-xl shadow-2xl max-w-[280px] break-words">
      Слушаю...
    </div>
    
    <button id="voiceBtn" onclick="toggleVoice()" class="w-14 h-14 rounded-2xl bg-[#1A1F2C] border border-white/10 flex items-center justify-center text-white shadow-2xl active:scale-90 transition">
      <!-- Iconimate Mic -->
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" x2="12" y1="19" y2="22"></line>
      </svg>
    </button>
  </div>

  <!-- ============================================== -->
  <!-- TAB BAR (Iconimate Icons + Live Avatar Tab)   -->
  <!-- ============================================== -->
  <nav class="fixed bottom-0 left-0 right-0 h-20 tabbar-blur flex items-center justify-around px-6 z-40">
    <!-- Вкладка Журнал -->
    <button id="tabBtnJournal" onclick="switchTab('journal')" class="flex flex-col items-center gap-1 text-indigo-400 transition-all active:scale-95">
      <div class="p-1 rounded-xl">
        <!-- Iconimate Calendar/Grid SVG -->
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <circle cx="8" cy="14" r="1" fill="currentColor"></circle>
          <circle cx="12" cy="14" r="1" fill="currentColor"></circle>
          <circle cx="16" cy="14" r="1" fill="currentColor"></circle>
        </svg>
      </div>
      <span class="text-[10px] font-bold tracking-wider uppercase">Журнал</span>
    </button>

    <!-- Вкладка Аватарка (Колесо) -->
    <button id="tabBtnProfile" onclick="switchTab('profile')" class="flex flex-col items-center gap-1 text-slate-500 transition-all active:scale-95">
      <div id="tabBarAvatarWrapper" class="w-7 h-7 rounded-full overflow-hidden border border-white/20 transition-transform">
        <!-- Сюда динамически рендерится выбранная SVG-аватарка -->
      </div>
      <span class="text-[10px] font-bold tracking-wider uppercase">Аватар</span>
    </button>
  </nav>

  <!-- ============================================== -->
  <!-- МОДАЛЬНОЕ ОКНО (Создание и Редактирование)     -->
  <!-- ============================================== -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 overflow-y-auto" onclick="if(event.target === this) closeModal()">
    <div class="min-h-full flex items-end sm:items-center justify-center">
      <div id="modalContainer" class="modal-enter w-full max-w-lg bg-[#11141D] border-t sm:border border-white/10 rounded-t-[30px] sm:rounded-[24px] p-6 space-y-4 pb-48 sm:pb-6">
        <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-1 sm:hidden"></div>
        
        <div class="flex items-center justify-between pb-1">
          <h3 id="modalHeading" class="text-lg font-bold text-white tracking-tight">Добавить занятие</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-white active:scale-90">✕</button>
        </div>

        <input type="hidden" id="editLessonId" value="">

        <!-- Поле: Ученик -->
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Ученик и предмет</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <!-- Iconimate User -->
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input id="inStudent" type="text" placeholder="Алиса (Математика)" class="w-full pl-10 pr-3.5 py-3.5 rounded-xl text-sm font-medium" onfocus="handleInputFocus(this)">
          </div>
        </div>

        <!-- Поля: Дата и Время с иконками Iconimate -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Дата</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-indigo-400">
                <!-- Iconimate Calendar Day Icon -->
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <input id="inDate" type="date" class="w-full pl-10 pr-3.5 py-3.5 rounded-xl text-sm font-medium" onfocus="handleInputFocus(this)">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Время</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-indigo-400">
                <!-- Iconimate Clock Icon -->
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </span>
              <input id="inTime" type="time" class="w-full pl-10 pr-3.5 py-3.5 rounded-xl text-sm font-medium" onfocus="handleInputFocus(this)">
            </div>
          </div>
        </div>

        <!-- Поле: Стоимость -->
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Стоимость (₽)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-400 font-bold text-sm">₽</span>
            <input id="inPrice" type="number" placeholder="2500" class="w-full pl-10 pr-3.5 py-3.5 rounded-xl text-sm font-medium" onfocus="handleInputFocus(this)">
          </div>
        </div>

        <!-- Поле: Заметка -->
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Заметка к уроку</label>
          <textarea id="inNote" rows="2" placeholder="Тема урока, дз или ссылка..." class="w-full p-3.5 rounded-xl text-sm font-medium resize-none" onfocus="handleInputFocus(this)"></textarea>
        </div>

        <button onclick="saveLesson()" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-600 text-white font-bold text-sm shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition">
          Сохранить занятие
        </button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
      if (tg.setHeaderColor) tg.setHeaderColor('#0B0D13');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0B0D13');
    }

    // ==========================================
    // АВАТАРКИ: Оригами-талисманы (SVG)
    // ==========================================
    const AVATARS = [
      {
        id: 'dragon',
        name: 'Лазурный Дракончик',
        bg: 'linear-gradient(135deg, #10B981 0%, #064E3B 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><path d="M50 15 L70 35 L58 45 L78 60 L50 85 L35 60 L46 45 L30 35 Z" fill="#34D399"/><path d="M50 15 L58 45 L50 85 Z" fill="#059669"/><polygon points="70,35 88,38 78,60" fill="#6EE7B7"/><polygon points="30,35 12,38 35,60" fill="#047857"/></svg>`
      },
      {
        id: 'fox',
        name: 'Огненная Лисица',
        bg: 'linear-gradient(135deg, #F97316 0%, #7C2D12 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><polygon points="50,22 68,48 50,78 32,48" fill="#FB923C"/><polygon points="50,22 68,48 50,78" fill="#EA580C"/><polygon points="32,48 18,26 36,36" fill="#FDBA74"/><polygon points="68,48 82,26 64,36" fill="#C2410C"/><polygon points="44,78 50,86 56,78" fill="#FFFFFF"/></svg>`
      },
      {
        id: 'cat',
        name: 'Сиамский Кот',
        bg: 'linear-gradient(135deg, #38BDF8 0%, #0369A1 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><polygon points="30,25 45,40 25,55" fill="#0F172A"/><polygon points="70,25 55,40 75,55" fill="#1E293B"/><polygon points="45,40 55,40 65,70 35,70" fill="#E2E8F0"/><polygon points="50,40 50,70 35,70" fill="#CBD5E1"/><polygon points="44,52 50,56 56,52" fill="#0284C7"/></svg>`
      },
      {
        id: 'panda',
        name: 'Бамбуковая Панда',
        bg: 'linear-gradient(135deg, #A855F7 0%, #581C87 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><circle cx="50" cy="52" r="30" fill="#F8FAFC"/><polygon points="26,30 36,44 22,46" fill="#1E1B4B"/><polygon points="74,30 64,44 78,46" fill="#1E1B4B"/><polygon points="36,48 44,52 38,58" fill="#1E1B4B"/><polygon points="64,48 56,52 62,58" fill="#1E1B4B"/><polygon points="46,62 54,62 50,67" fill="#1E1B4B"/></svg>`
      },
      {
        id: 'rabbit',
        name: 'Розовый Кролик',
        bg: 'linear-gradient(135deg, #EC4899 0%, #831843 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><polygon points="42,16 48,46 36,46" fill="#F472B6"/><polygon points="58,16 52,46 64,46" fill="#FB7185"/><polygon points="36,46 64,46 72,78 28,78" fill="#FDF2F8"/><polygon points="50,46 50,78 72,78" fill="#FCE7F3"/></svg>`
      },
      {
        id: 'bird',
        name: 'Птица Феникс',
        bg: 'linear-gradient(135deg, #EAB308 0%, #713F12 100%)',
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full p-2"><polygon points="20,40 50,25 70,50 40,65" fill="#FDE047"/><polygon points="50,25 85,35 60,65" fill="#EAB308"/><polygon points="40,65 50,85 58,65" fill="#CA8A04"/></svg>`
      }
    ];

    let currentAvatarIndex = 0;
    let selectedAvatarId = localStorage.getItem('tutor_avatar_id') || 'dragon';

    function initAvatars() {
      const idx = AVATARS.findIndex(a => a.id === selectedAvatarId);
      currentAvatarIndex = idx !== -1 ? idx : 0;
      renderWheel();
      updateTabBarAvatar();
    }

    function renderWheel() {
      const wheel = document.getElementById('avatarWheel');
      wheel.innerHTML = '';
      const total = AVATARS.length;
      const angleStep = 360 / total;
      const radius = 135;

      AVATARS.forEach((av, i) => {
        const cell = document.createElement('div');
        cell.className = 'wheel-cell';
        cell.style.background = av.bg;
        cell.innerHTML = av.svg;

        const phi = i * angleStep;
        cell.style.transform = `rotateY(${phi}deg) translateZ(${radius}px)`;

        cell.onclick = () => {
          haptic('light');
          currentAvatarIndex = i;
          applyWheelRotation();
        };

        wheel.appendChild(cell);
      });

      applyWheelRotation();
    }

    function applyWheelRotation() {
      const total = AVATARS.length;
      const angleStep = 360 / total;
      const wheel = document.getElementById('avatarWheel');
      const rotY = -currentAvatarIndex * angleStep;
      wheel.style.transform = `rotateY(${rotY}deg)`;

      const cur = AVATARS[currentAvatarIndex];
      document.getElementById('currentAvatarName').innerText = cur.name;
    }

    function rotateWheel(direction) {
      haptic('light');
      const total = AVATARS.length;
      currentAvatarIndex = (currentAvatarIndex + direction + total) % total;
      applyWheelRotation();
    }

    function confirmSelectedAvatar() {
      const cur = AVATARS[currentAvatarIndex];
      selectedAvatarId = cur.id;
      localStorage.setItem('tutor_avatar_id', cur.id);
      if (tg?.CloudStorage) tg.CloudStorage.setItem('tutor_avatar_id', cur.id);
      haptic('success');
      updateTabBarAvatar();
      if (tg?.showAlert) tg.showAlert(`Талисман «${cur.name}» установлен!`);
    }

    function updateTabBarAvatar() {
      const av = AVATARS.find(a => a.id === selectedAvatarId) || AVATARS[0];
      const wrap = document.getElementById('tabBarAvatarWrapper');
      wrap.style.background = av.bg;
      wrap.innerHTML = av.svg;

      const preview = document.getElementById('previewCurrentAvatar');
      if (preview) {
        preview.style.background = av.bg;
        preview.innerHTML = av.svg;
      }
    }

    // ==========================================
    // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК TAB BAR
    // ==========================================
    function switchTab(tab) {
      haptic('light');
      const jTab = document.getElementById('tabJournal');
      const pTab = document.getElementById('tabProfile');
      const btnJ = document.getElementById('tabBtnJournal');
      const btnP = document.getElementById('tabBtnProfile');
      const mic = document.getElementById('floatingVoiceWrap');

      if (tab === 'journal') {
        jTab.classList.remove('hidden');
        pTab.classList.add('hidden');
        btnJ.className = 'flex flex-col items-center gap-1 text-indigo-400 transition-all active:scale-95';
        btnP.className = 'flex flex-col items-center gap-1 text-slate-500 transition-all active:scale-95';
        mic.classList.remove('hidden');
      } else {
        jTab.classList.add('hidden');
        pTab.classList.remove('hidden');
        btnJ.className = 'flex flex-col items-center gap-1 text-slate-500 transition-all active:scale-95';
        btnP.className = 'flex flex-col items-center gap-1 text-indigo-400 transition-all active:scale-95';
        mic.classList.add('hidden');
        applyWheelRotation();
      }
    }

    // ==========================================
    // ОСНОВНАЯ ЛОГИКА УРОКОВ
    // ==========================================
    let currentDate = new Date();
    let selectedDate = new Date();
    let lessons = [];

    function haptic(type = 'light') {
      if (!tg?.HapticFeedback) return;
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
    }

    function handleInputFocus(elem) {
      setTimeout(() => {
        elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    }

    function loadData() {
      try {
        const local = localStorage.getItem('tutor_lessons_v5');
        if (local) lessons = JSON.parse(local);
      } catch (e) {}

      if (tg?.CloudStorage) {
        tg.CloudStorage.getItem('tutor_lessons_v5', (err, val) => {
          if (!err && val) {
            try { lessons = JSON.parse(val); render(); } catch(e) {}
          } else {
            render();
          }
        });
        tg.CloudStorage.getItem('tutor_avatar_id', (err, val) => {
          if (!err && val) {
            selectedAvatarId = val;
            initAvatars();
          }
        });
      } else {
        render();
      }
      initAvatars();
    }

    function saveData() {
      const json = JSON.stringify(lessons);
      localStorage.setItem('tutor_lessons_v5', json);
      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('tutor_lessons_v5', json);
      }
      render();
    }

    const pad = (n) => String(n).padStart(2, '0');
    const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    function renderDaysRow() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      const dayNames = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

      document.getElementById('monthTitle').innerText = `${monthNames[month]} ${year}`;

      const totalDays = new Date(year, month + 1, 0).getDate();
      const container = document.getElementById('daysRow');
      container.innerHTML = '';

      const selISO = toISO(selectedDate);

      for (let day = 1; day <= totalDays; day++) {
        const dObj = new Date(year, month, day);
        const iso = toISO(dObj);
        const isSelected = iso === selISO;
        const hasLessons = lessons.some(l => l.date === iso);

        const btn = document.createElement('button');
        btn.className = `day-pill flex-shrink-0 w-12 py-3 rounded-2xl border flex flex-col items-center justify-center gap-1 ${
          isSelected 
            ? 'active' 
            : 'bg-[#171B26] border-white/5 text-slate-400 hover:border-white/10'
        }`;

        btn.innerHTML = `
          <span class="text-[10px] uppercase font-bold tracking-wider opacity-60">${dayNames[dObj.getDay()]}</span>
          <span class="text-base font-bold ${isSelected ? 'text-white' : 'text-slate-200'}">${day}</span>
          <span class="w-1.5 h-1.5 rounded-full ${hasLessons ? (isSelected ? 'bg-white' : 'bg-indigo-400') : 'bg-transparent'}"></span>
        `;

        btn.onclick = () => {
          haptic('light');
          selectedDate = dObj;
          render();
        };

        container.appendChild(btn);

        if (isSelected) {
          setTimeout(() => btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }), 50);
        }
      }
    }

    function render() {
      renderDaysRow();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthPrefix = `${year}-${pad(month + 1)}`;
      const selISO = toISO(selectedDate);

      const mLessons = lessons.filter(l => l.date.startsWith(monthPrefix));
      const mEarned = mLessons.reduce((acc, l) => l.status === 'completed' ? acc + Number(l.price) : acc, 0);
      const mCompleted = mLessons.filter(l => l.status === 'completed').length;
      document.getElementById('monthTotal').innerText = `${mEarned.toLocaleString('ru-RU')} ₽`;
      document.getElementById('monthCompletedStat').innerText = `${mCompleted} из ${mLessons.length} проведено`;

      const dayLessons = lessons.filter(l => l.date === selISO).sort((a,b) => a.time.localeCompare(b.time));
      const dEarned = dayLessons.reduce((acc, l) => l.status === 'completed' ? acc + Number(l.price) : acc, 0);
      document.getElementById('dayTotal').innerText = `${dEarned.toLocaleString('ru-RU')} ₽`;
      document.getElementById('dayLessonsStat').innerText = `${dayLessons.length} записей`;

      const todayISO = toISO(new Date());
      const dateBadge = document.getElementById('activeDateBadge');
      if (selISO === todayISO) {
        dateBadge.innerText = 'Сегодня';
      } else {
        const df = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
        dateBadge.innerText = df.format(selectedDate);
      }

      const listEl = document.getElementById('lessonsList');
      if (dayLessons.length === 0) {
        listEl.innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center border-dashed border-white/10">
            <p class="text-sm font-semibold text-slate-400">На этот день уроков нет</p>
            <p class="text-xs text-slate-600 mt-1">Нажмите «+ Новый урок» или надиктуйте микрофоном</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = dayLessons.map(l => {
        const isDone = l.status === 'completed';
        const isCanceled = l.status === 'canceled';

        const statusBg = isDone ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                         isCanceled ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                         'bg-amber-500/10 text-amber-400 border-amber-500/20';
        const statusText = isDone ? 'Проведён' : isCanceled ? 'Отменён' : 'Запланирован';

        return `
          <div class="glass-card p-4 rounded-2xl space-y-3">
            <div class="flex items-start justify-between">
              <div>
                <h4 class="text-base font-bold text-white tracking-tight">${l.student}</h4>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-xs font-semibold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded flex items-center gap-1">
                    <!-- Iconimate Clock Mini -->
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ${l.time}
                  </span>
                  <span class="text-sm font-extrabold text-white">${Number(l.price).toLocaleString('ru-RU')} ₽</span>
                </div>
              </div>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg border ${statusBg}">
                ${statusText}
              </span>
            </div>

            ${l.note ? `<p class="text-xs text-slate-400 bg-white/[0.03] p-2.5 rounded-xl border border-white/5 leading-relaxed">${l.note}</p>` : ''}

            <div class="flex items-center justify-between pt-2 border-t border-white/5">
              <div class="flex items-center gap-2">
                <button onclick="toggleStatus('${l.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 active:scale-95 transition">
                  Статус
                </button>
                <!-- КНОПКА РЕДАКТИРОВАНИЯ С ИКОНКОЙ ICONIMATE -->
                <button onclick="openModalForEdit('${l.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/20 active:scale-95 transition flex items-center gap-1">
                  <!-- Iconimate Edit Pencil -->
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                    <path d="m15 5 4 4"></path>
                  </svg>
                  Изменить
                </button>
              </div>

              <!-- КНОПКА УДАЛЕНИЯ -->
              <button onclick="deleteLesson('${l.id}')" class="p-2 text-rose-400 hover:text-rose-300 active:scale-90">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // МОДАЛКА: СОЗДАНИЕ И РЕДАКТИРОВАНИЕ
    // ==========================================
    function openModalForCreate() {
      haptic('light');
      document.getElementById('editLessonId').value = '';
      document.getElementById('modalHeading').innerText = 'Добавить занятие';
      document.getElementById('inDate').value = toISO(selectedDate);
      document.getElementById('inTime').value = '14:00';
      document.getElementById('inStudent').value = '';
      document.getElementById('inPrice').value = '';
      document.getElementById('inNote').value = '';
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function openModalForEdit(id) {
      haptic('light');
      const item = lessons.find(l => l.id === id);
      if (!item) return;

      document.getElementById('editLessonId').value = item.id;
      document.getElementById('modalHeading').innerText = 'Редактировать занятие';
      document.getElementById('inStudent').value = item.student;
      document.getElementById('inDate').value = item.date;
      document.getElementById('inTime').value = item.time;
      document.getElementById('inPrice').value = item.price;
      document.getElementById('inNote').value = item.note || '';

      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
      document.getElementById('editLessonId').value = '';
    }

    function saveLesson() {
      const editId = document.getElementById('editLessonId').value;
      const student = document.getElementById('inStudent').value.trim();
      const date = document.getElementById('inDate').value;
      const time = document.getElementById('inTime').value;
      const price = document.getElementById('inPrice').value;
      const note = document.getElementById('inNote').value.trim();

      if (!student || !date || !price || !time) {
        haptic('warning');
        if (tg?.showAlert) tg.showAlert('Заполните ученика, дату, время и стоимость');
        return;
      }

      if (editId) {
        // Режим обновления существующего урока
        const item = lessons.find(l => l.id === editId);
        if (item) {
          item.student = student;
          item.date = date;
          item.time = time;
          item.price = Number(price);
          item.note = note;
        }
      } else {
        // Режим создания нового
        lessons.push({
          id: 'ls_' + Date.now(),
          student, date, time, note,
          price: Number(price),
          status: 'scheduled'
        });
      }

      haptic('success');
      saveData();
      closeModal();
    }

    function toggleStatus(id) {
      const item = lessons.find(l => l.id === id);
      if (!item) return;
      const chain = ['scheduled', 'completed', 'canceled'];
      const nextIdx = (chain.indexOf(item.status) + 1) % 3;
      item.status = chain[nextIdx];
      haptic('medium');
      saveData();
    }

    function deleteLesson(id) {
      if (tg?.showConfirm) {
        tg.showConfirm('Удалить эту запись?', (ok) => {
          if (ok) {
            lessons = lessons.filter(l => l.id !== id);
            haptic('warning');
            saveData();
          }
        });
      } else {
        lessons = lessons.filter(l => l.id !== id);
        saveData();
      }
    }

    document.getElementById('prevMonthBtn').onclick = () => {
      haptic('light');
      currentDate.setMonth(currentDate.getMonth() - 1);
      render();
    };
    document.getElementById('nextMonthBtn').onclick = () => {
      haptic('light');
      currentDate.setMonth(currentDate.getMonth() + 1);
      render();
    };

    // ==========================================
    // ГОЛОСОВОЙ ПОМОЩНИК
    // ==========================================
    let recognition = null;
    let isListening = false;
    let latestRecognizedText = '';

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        latestRecognizedText = '';
        document.getElementById('voiceBtn').classList.add('mic-active');
        const st = document.getElementById('voiceStatus');
        st.innerText = 'Слушаю вас... Нажмите еще раз, чтобы применить';
        st.classList.remove('hidden');
        haptic('light');
      };

      recognition.onresult = (e) => {
        let full = '';
        for (let i = 0; i < e.results.length; ++i) {
          full += ' ' + e.results[i][0].transcript;
        }
        latestRecognizedText = full.trim();
        if (latestRecognizedText) {
          document.getElementById('voiceStatus').innerText = `«${latestRecognizedText}»`;
        }
      };

      recognition.onerror = (err) => {
        console.warn('Speech err:', err);
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function toggleVoice() {
      if (!recognition) {
        if (tg?.showAlert) tg.showAlert('Голосовой ввод не поддерживается на этом устройстве.');
        return;
      }

      if (isListening) {
        isListening = false;
        recognition.stop();
        document.getElementById('voiceBtn').classList.remove('mic-active');

        const cmd = latestRecognizedText.trim();
        if (cmd) {
          parseVoiceCommand(cmd);
        } else {
          document.getElementById('voiceStatus').innerText = 'Ничего не услышал';
          setTimeout(() => document.getElementById('voiceStatus').classList.add('hidden'), 2000);
        }
      } else {
        latestRecognizedText = '';
        try { recognition.start(); } catch(e) {}
      }
    }

    function extractDateFromText(txt) {
      let targetDate = new Date(selectedDate);
      if (txt.includes('сегодня')) {
        targetDate = new Date();
      } else if (txt.includes('вчера')) {
        targetDate = new Date();
        targetDate.setDate(targetDate.getDate() - 1);
      } else if (txt.includes('завтра')) {
        targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 1);
      } else {
        const numMatch = txt.match(/(\d{1,2})\s*(январ|феврал|март|апрел|ма|июн|июл|август|сентябр|октябр|ноябр|декабр)?/);
        if (numMatch) {
          const dayNum = parseInt(numMatch[1], 10);
          targetDate.setDate(dayNum);
          if (numMatch[2]) {
            const months = ["январ", "феврал", "март", "апрел", "ма", "июн", "июл", "август", "сентябр", "октябр", "ноябр", "декабр"];
            const mIdx = months.findIndex(m => numMatch[2].startsWith(m));
            if (mIdx !== -1) targetDate.setMonth(mIdx);
          }
        }
      }
      return targetDate;
    }

    function parseVoiceCommand(raw) {
      const txt = raw.toLowerCase().trim();
      const targetDate = extractDateFromText(txt);
      const targetISO = toISO(targetDate);
      const statusBanner = document.getElementById('voiceStatus');

      // 1. УДАЛЕНИЕ
      if (txt.includes('удали') || txt.includes('удалить') || txt.includes('убери') || txt.includes('сотри')) {
        let idx = lessons.findIndex(l => l.date === targetISO);
        if (idx === -1) {
          idx = lessons.findIndex(l => txt.includes(l.student.toLowerCase()));
        }
        if (idx !== -1) {
          const deleted = lessons.splice(idx, 1)[0];
          saveData();
          haptic('warning');
          statusBanner.innerText = `Урок (${deleted.student}) удалён`;
          setTimeout(() => statusBanner.classList.add('hidden'), 3000);
          return;
        } else {
          statusBanner.innerText = `Урок не найден`;
          setTimeout(() => statusBanner.classList.add('hidden'), 3000);
          return;
        }
      }

      // 2. СМЕНА СТАТУСА: ПРОЙДЕН
      const successKeywords = [
        'проведен', 'проведён', 'состоялся', 'был урок', 'прошел', 'прошёл',
        'успешно', 'отзанимались', 'провели', 'закончили', 'оплатил',
        'занимались', 'сделали', 'отвели', 'всё ок', 'все ок'
      ];
      if (successKeywords.some(w => txt.includes(w))) {
        let found = lessons.find(l => l.date === targetISO);
        if (!found) {
          found = lessons.find(l => txt.includes(l.student.toLowerCase()));
        }
        if (found) {
          found.status = 'completed';
          selectedDate = new Date(found.date + 'T00:00:00');
          currentDate = new Date(selectedDate);
          saveData();
          haptic('success');
          statusBanner.innerText = `Урок (${found.student}): Проведён ✓`;
          setTimeout(() => statusBanner.classList.add('hidden'), 3000);
          return;
        }
      }

      // 3. СМЕНА СТАТУСА: ОТМЕНЁН
      const cancelKeywords = [
        'отменен', 'отменён', 'не состоялся', 'не был', 'сорвался',
        'заболел', 'перенесли', 'отменили', 'пропустил', 'не пришел'
      ];
      if (cancelKeywords.some(w => txt.includes(w))) {
        let found = lessons.find(l => l.date === targetISO);
        if (!found) {
          found = lessons.find(l => txt.includes(l.student.toLowerCase()));
        }
        if (found) {
          found.status = 'canceled';
          selectedDate = new Date(found.date + 'T00:00:00');
          currentDate = new Date(selectedDate);
          saveData();
          haptic('warning');
          statusBanner.innerText = `Урок (${found.student}): Отменён ✕`;
          setTimeout(() => statusBanner.classList.add('hidden'), 3000);
          return;
        }
      }

      // 4. ДОБАВЛЕНИЕ
      if (txt.includes('добав') || txt.includes('запиш') || txt.includes('создай') || txt.includes('поставь') || txt.includes('урок')) {
        let time = '14:00';
        const timeMatch = txt.match(/(?:в\s*)?(\d{1,2})(?::(\d{2})|\s+(\d{2}))?/);
        if (timeMatch && parseInt(timeMatch[1]) < 24) {
          const hh = pad(timeMatch[1]);
          const mm = timeMatch[2] || timeMatch[3] || '00';
          time = `${hh}:${mm}`;
        }

        let price = 2000;
        const priceMatch = txt.match(/(\d{3,6})\s*(?:руб|р|₽)?/);
        if (priceMatch) {
          price = Number(priceMatch[1]);
        }

        let student = 'Новый ученик';
        const nameMatch = txt.match(/(?:с|ученик|для)\s+([А-Яа-яA-Za-z]+)/);
        if (nameMatch) {
          student = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        }

        lessons.push({
          id: 'ls_' + Date.now(),
          student,
          date: targetISO,
          time,
          price,
          status: 'scheduled',
          note: 'Добавлено голосом'
        });

        selectedDate = targetDate;
        currentDate = new Date(targetDate);
        saveData();
        haptic('success');
        statusBanner.innerText = `Урок добавлен: ${student}`;
        setTimeout(() => statusBanner.classList.add('hidden'), 3000);
        return;
      }

      statusBanner.innerText = 'Команда не распознана';
      setTimeout(() => statusBanner.classList.add('hidden'), 3000);
    }

    loadData();
  </script>
</body>
</html>
